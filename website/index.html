<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>座位表生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .section-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        /* 总览图区域 */
        #seat-map-overview {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
            position: relative;
        }

        /* 茶水间标识 */
        .pantry-label {
            text-align: center;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            margin-bottom: 15px;
            padding: 8px;
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            border-radius: 8px;
        }

        /* 侧边标识容器 */
        .seat-map-wrapper {
            display: flex;
            align-items: stretch;
        }

        .side-label {
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-lr;
            text-orientation: upright;
            font-size: 0.9em;
            font-weight: 600;
            color: #666;
            padding: 0 15px;
            background: linear-gradient(180deg, #dfe6e9, #b2bec3);
            border-radius: 8px;
            margin: 0 10px;
        }

        .overview-row {
            display: flex;
            margin-bottom: 25px;
            justify-content: center;
        }

        .overview-desk {
            display: flex;
            flex-direction: column;
            margin: 0 2px;
            align-items: center;
        }

        .desk-unit {
            background: linear-gradient(145deg, #f0f4ff, #e8ecff);
            border: 1px solid #667eea;
            border-radius: 3px;
            padding: 2px;
            margin: 1px;
            min-width: 42px;
            text-align: center;
            position: relative;
        }

        .seat-name {
            font-size: 0.55em;
            color: #333;
            padding: 1px 3px;
            background: white;
            border-radius: 2px;
            margin: 1px 0;
            min-height: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: all 0.15s ease-out;
            user-select: none;
        }

        .seat-name.assigned {
            background: linear-gradient(135deg, #81ecec, #74b9ff);
            color: #2d3436;
            font-weight: 500;
            cursor: pointer;
        }

        .seat-name:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .seat-name.assigned:hover {
            background: linear-gradient(135deg, #fd79a8, #fdcb6e);
        }

        .seat-name.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .seat-name.drag-over {
            background: #ffd700 !important;
            color: #333 !important;
            border: 2px dashed #ff6b6b !important;
            transform: scale(1.3) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important;
            z-index: 100;
            position: relative;
        }

        .seat-name.empty {
            background: #f0f0f0;
            color: #999;
        }
        
        .seat-name.assigned-seat {
            background-image: none;
            cursor: pointer;
        }

        /* 控制面板 */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            color: #555;
            font-weight: 500;
        }

        .control-group input[type="number"] {
            width: 60px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f, #a8e063);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(86, 171, 47, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349, #f45c43);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(235, 51, 73, 0.4);
        }

        .btn-info {
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 147, 176, 0.4);
        }

        /* 每行设置 */
        .row-settings {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: white;
            border-radius: 6px;
            margin-top: 10px;
        }

        .row-setting {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .row-setting label {
            min-width: 60px;
            color: #555;
        }

        .row-setting input {
            width: 60px;
            padding: 6px;
            border: 2px solid #ddd;
            border-radius: 4px;
        }

        /* 员工名单 */
        .employee-input {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9em;
            resize: vertical;
        }

        .employee-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .employee-tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: grab;
            user-select: none;
            transition: all 0.2s;
        }
        
        .employee-tag.dragging {
            opacity: 0.5;
        }

        /* 部门分组样式 */
        .department-group {
            flex: 1 1 calc(25% - 12px);
            min-width: calc(25% - 12px);
            max-width: calc(25% - 12px);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #dee2e6;
        }

        .department-title {
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 8px;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .department-count {
            font-size: 0.8em;
            background: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .department-employee-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 40px;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .department-employee-list::-webkit-scrollbar {
            width: 4px;
        }
        
        .department-employee-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 2px;
        }
        
        .department-employee-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 2px;
        }

        /* 导入区域 */
        .import-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .import-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .import-area input[type="file"] {
            display: none;
        }

        /* 导出按钮 */
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        /* 预览模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 20px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
        }

        .modal-content img {
            max-width: 100%;
        }

        .close-modal {
            float: right;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 座位表生成器</h1>

        <!-- 座位图总览 -->
        <div class="section">
            <div class="section-title">座位图总览</div>
            <div id="seat-map-overview"></div>
            <div class="export-buttons">
                <button class="btn btn-success" onclick="exportAsImage()">导出为图片</button>
                <button class="btn btn-info" onclick="previewImage()">预览导出效果</button>
            </div>
        </div>

        <!-- 解析后的员工名单（可拖拽） -->
        <div class="section">
            <div class="section-title">待分配员工（拖拽到座位图）</div>
            <div id="employee-list-container" style="display: flex; flex-wrap: wrap; gap: 15px; background: white; padding: 15px; border-radius: 8px; border: 2px dashed #ccc;"></div>
            <span id="employee-count" style="color: #666; margin-top: 10px; display: block;"></span>
        </div>

        <!-- 员工名单输入区 -->
        <div class="section">
            <div class="section-title">员工名单（格式：部门-姓名，每行一个）</div>
            <textarea id="employee-input" class="employee-input" placeholder="请输入员工名单，每行一个名字..."></textarea>
            <div class="controls" style="margin-top: 10px;">
                <button class="btn btn-primary" onclick="parseEmployees()">解析员工名单</button>
                <button class="btn btn-success" onclick="autoAssignSeats()">自动分配座位</button>
            </div>
        </div>

        <!-- 导入员工名单 -->
        <div class="section">
            <div class="section-title">导入员工名单</div>
            <div class="import-area" onclick="document.getElementById('file-input').click()">
                <input type="file" id="file-input" accept=".txt,.csv,.xlsx,.xls" onchange="importFile(event)">
                <p style="font-size: 1.1em; color: #666;">点击或拖拽文件到此处</p>
                <p style="font-size: 0.9em; color: #999; margin-top: 8px;">支持 .txt, .csv 文件</p>
            </div>
        </div>

        <!-- 行列设置 -->
        <div class="section">
            <div class="section-title">行列设置</div>
            <div class="controls">
                <div class="control-group">
                    <label>总行数：</label>
                    <input type="number" id="total-rows" value="11" min="1" max="20">
                </div>
                <div class="control-group">
                    <label>默认列数（日字格）：</label>
                    <input type="number" id="default-cols" value="7" min="1" max="20">
                </div>
                <button class="btn btn-primary" onclick="applySettings()">应用设置</button>
                <button class="btn btn-primary" onclick="generateSeats()">生成座位表</button>
                <button class="btn btn-danger" onclick="clearSeats()">清空座位</button>
            </div>
            <div id="row-settings-container" class="row-settings"></div>
        </div>
    </div>

    <!-- 预览模态框 -->
    <div id="preview-modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 style="margin-bottom: 15px;">导出预览</h3>
            <div id="preview-image-container"></div>
        </div>
    </div>

    <script>
        // 全局状态
        let employees = [];
        let seatMap = [];
        let draggedElement = null;
        let draggedSeatPosition = null;

        // 部门列表和对应颜色
        const DEPARTMENTS = {
            '武汉分部': { color: '#ff6b6b', light: '#fff0f0' },
            '华东销售': { color: '#4ecdc4', light: '#f0fffd' },
            '课程': { color: '#45b7d1', light: '#f0f9ff' },
            '新媒体': { color: '#f9ca24', light: '#fffef0' },
            '市场': { color: '#f0932b', light: '#fff8f0' },
            '高校': { color: '#6c5ce7', light: '#f5f0ff' },
            '教务': { color: '#fd79a8', light: '#fff0f7' },
            '师资': { color: '#00b894', light: '#f0fff9' },
            '其他': { color: '#636e72', light: '#f8f9fa' }
        };

        // 保存数据到localStorage
        function saveData() {
            const data = {
                employees: employees,
                seatMap: seatMap,
                totalRows: parseInt(document.getElementById('total-rows').value) || 11,
                defaultCols: parseInt(document.getElementById('default-cols').value) || 7,
                rowSettings: Array.from(document.querySelectorAll('.row-cols-input')).map(input => ({
                    row: parseInt(input.dataset.row),
                    cols: parseInt(input.value)
                }))
            };
            localStorage.setItem('seatMapData', JSON.stringify(data));
        }

        // 从localStorage读取数据
        function loadData() {
            const saved = localStorage.getItem('seatMapData');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    employees = data.employees || [];
                    seatMap = data.seatMap || [];
                    
                    if (data.totalRows) document.getElementById('total-rows').value = data.totalRows;
                    if (data.defaultCols) document.getElementById('default-cols').value = data.defaultCols;
                    
                    if (employees.length > 0) {
                        document.getElementById('employee-input').value = employees.join('\n');
                    }
                    return true;
                } catch (e) {
                    console.error('读取数据失败', e);
                }
            }
            return false;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (!loadData()) {
                loadSampleEmployees();
            }
            applySettings();
            parseEmployees(); // 解析并显示员工列表
        });

        // 加载示例员工
        function loadSampleEmployees() {
            const sampleNames = [];
            const surnames = ['张', '李', '王', '刘', '陈', '杨', '赵', '黄', '周', '吴', '徐', '孙', '胡', '朱', '高', '林', '何', '郭', '马', '罗'];
            const names = ['伟', '芳', '娜', '敏', '静', '丽', '强', '磊', '军', '洋', '勇', '艳', '杰', '娟', '涛', '明', '超', '秀英', '霞', '平', '刚', '桂英', '华', '建', '文', '辉', '玲', '婷', '宇', '浩'];
            const deptNames = Object.keys(DEPARTMENTS).filter(d => d !== '其他');
            
            for (let i = 0; i < 100; i++) {
                const department = deptNames[i % deptNames.length];
                const surname = surnames[i % surnames.length];
                const name = names[i % names.length];
                sampleNames.push(`${department}-${surname}${name}${i + 1}`);
            }
            document.getElementById('employee-input').value = sampleNames.join('\n');
        }

        // 应用行列设置
        function applySettings() {
            const totalRows = parseInt(document.getElementById('total-rows').value) || 5;
            const defaultCols = parseInt(document.getElementById('default-cols').value) || 5;
            
            // 尝试读取已保存的行数设置
            let savedRowSettings = [];
            try {
                const saved = localStorage.getItem('seatMapData');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.rowSettings) savedRowSettings = data.rowSettings;
                }
            } catch (e) {}
            
            const container = document.getElementById('row-settings-container');
            container.innerHTML = '';
            
            for (let i = 0; i < totalRows; i++) {
                const savedRow = savedRowSettings.find(r => r.row === i);
                const cols = savedRow ? savedRow.cols : defaultCols;
                
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row-setting';
                rowDiv.innerHTML = `
                    <label>第 ${i + 1} 行：</label>
                    <input type="number" class="row-cols-input" data-row="${i}" value="${cols}" min="1" max="20">
                    <span style="color: #888;">个日字格（可坐 ${cols * 2} 人）</span>
                `;
                container.appendChild(rowDiv);
            }
            
            generateSeats();
            saveData();
        }

        // 生成座位表
        function generateSeats() {
            const rowInputs = document.querySelectorAll('.row-cols-input');
            seatMap = [];
            
            rowInputs.forEach(input => {
                const row = parseInt(input.dataset.row);
                const cols = parseInt(input.value) || 5;
                seatMap[row] = { cols: cols, seats: new Array(cols * 2).fill(null) };
            });
            
            renderSeatMap();
        }

        // 渲染座位图
        function renderSeatMap() {
            const container = document.getElementById('seat-map-overview');
            container.innerHTML = '';
            
            // 添加茶水间标识
            const pantryLabel = document.createElement('div');
            pantryLabel.className = 'pantry-label';
            pantryLabel.textContent = '🍵 茶水间';
            container.appendChild(pantryLabel);
            
            // 创建包装器，包含侧边标识和座位
            const wrapper = document.createElement('div');
            wrapper.className = 'seat-map-wrapper';
            
            // 左侧靠过道标识
            const leftLabel = document.createElement('div');
            leftLabel.className = 'side-label';
            leftLabel.textContent = '靠过道';
            wrapper.appendChild(leftLabel);
            
            // 座位区域容器
            const seatsContainer = document.createElement('div');
            seatsContainer.style.flex = '1';
            
            seatMap.forEach((row, rowIndex) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'overview-row';
                
                for (let col = 0; col < row.cols; col++) {
                    const deskDiv = document.createElement('div');
                    deskDiv.className = 'overview-desk';
                    
                    // 上半座位
                    const deskUnit1 = document.createElement('div');
                    deskUnit1.className = 'desk-unit';
                    const seat1Index = col * 2;
                    const seat1Val = seatMap[rowIndex].seats[seat1Index];
                    
                    const seat1 = document.createElement('div');
                    seat1.dataset.row = rowIndex;
                    seat1.dataset.seat = seat1Index;
                    seat1.draggable = !!seat1Val && seat1Val !== '/';
                    if (seat1Val && seat1Val !== '/') {
                        const { name, fullName, department } = parseEmployeeName(seat1Val);
                        const deptStyle = DEPARTMENTS[department] || DEPARTMENTS['其他'];
                        seat1.className = 'seat-name assigned-seat';
                        seat1.style.backgroundColor = deptStyle.color;
                        seat1.style.color = 'white';
                        seat1.style.border = `1px solid ${deptStyle.color}`;
                        seat1.style.fontWeight = 'bold';
                        seat1.style.backgroundImage = 'none';
                        seat1.textContent = name;
                        seat1.title = fullName; // 鼠标悬停显示全名
                        
                        deskUnit1.style.backgroundColor = deptStyle.light;
                        deskUnit1.style.border = `1px solid ${deptStyle.color}`;
                        deskUnit1.style.backgroundImage = 'none';
                        
                        // 添加hover效果
                        seat1.addEventListener('mouseenter', () => {
                            seat1.style.transform = 'scale(1.05)';
                        });
                        seat1.addEventListener('mouseleave', () => {
                            seat1.style.transform = 'scale(1)';
                        });
                    } else {
                        seat1.className = 'seat-name empty';
                        seat1.textContent = seat1Val === '/' ? '/' : '空';
                        seat1.style.cursor = 'pointer';
                        deskUnit1.style.backgroundColor = '#f0f0f0';
                        deskUnit1.style.border = '1px solid #ddd';
                    }
                    seat1.ondragstart = onDragStart;
                    seat1.ondragend = onDragEnd;
                    seat1.ondragover = onDragOver;
                    seat1.ondrop = onDrop;
                    seat1.ondragleave = onDragLeave;
                    if (seat1Val && seat1Val !== '/') {
                        seat1.onclick = () => unassignSeat(rowIndex, seat1Index);
                    } else {
                        seat1.onclick = () => toggleEmptySeat(rowIndex, seat1Index);
                    }
                    
                    deskUnit1.appendChild(seat1);
                    
                    // 下半座位
                    const deskUnit2 = document.createElement('div');
                    deskUnit2.className = 'desk-unit';
                    const seat2Index = col * 2 + 1;
                    const seat2Val = seatMap[rowIndex].seats[seat2Index];
                    
                    const seat2 = document.createElement('div');
                    seat2.dataset.row = rowIndex;
                    seat2.dataset.seat = seat2Index;
                    seat2.draggable = !!seat2Val && seat2Val !== '/';
                    if (seat2Val && seat2Val !== '/') {
                        const { name, fullName, department } = parseEmployeeName(seat2Val);
                        const deptStyle = DEPARTMENTS[department] || DEPARTMENTS['其他'];
                        seat2.className = 'seat-name assigned-seat';
                        seat2.style.backgroundColor = deptStyle.color;
                        seat2.style.color = 'white';
                        seat2.style.border = `1px solid ${deptStyle.color}`;
                        seat2.style.fontWeight = 'bold';
                        seat2.style.backgroundImage = 'none';
                        seat2.textContent = name;
                        seat2.title = fullName; // 鼠标悬停显示全名
                        
                        deskUnit2.style.backgroundColor = deptStyle.light;
                        deskUnit2.style.border = `1px solid ${deptStyle.color}`;
                        deskUnit2.style.backgroundImage = 'none';
                        
                        // 添加hover效果
                        seat2.addEventListener('mouseenter', () => {
                            seat2.style.transform = 'scale(1.05)';
                        });
                        seat2.addEventListener('mouseleave', () => {
                            seat2.style.transform = 'scale(1)';
                        });
                    } else {
                        seat2.className = 'seat-name empty';
                        seat2.textContent = seat2Val === '/' ? '/' : '空';
                        seat2.style.cursor = 'pointer';
                        deskUnit2.style.backgroundColor = '#f0f0f0';
                        deskUnit2.style.border = '1px solid #ddd';
                    }
                    seat2.ondragstart = onDragStart;
                    seat2.ondragend = onDragEnd;
                    seat2.ondragover = onDragOver;
                    seat2.ondrop = onDrop;
                    seat2.ondragleave = onDragLeave;
                    if (seat2Val && seat2Val !== '/') {
                        seat2.onclick = () => unassignSeat(rowIndex, seat2Index);
                    } else {
                        seat2.onclick = () => toggleEmptySeat(rowIndex, seat2Index);
                    }
                    
                    deskUnit2.appendChild(seat2);
                    
                    deskDiv.appendChild(deskUnit1);
                    deskDiv.appendChild(deskUnit2);
                    rowDiv.appendChild(deskDiv);
                }
                
                seatsContainer.appendChild(rowDiv);
            });
            
            wrapper.appendChild(seatsContainer);
            
            // 右侧靠墙标识
            const rightLabel = document.createElement('div');
            rightLabel.className = 'side-label';
            rightLabel.textContent = '靠墙';
            wrapper.appendChild(rightLabel);
            
            container.appendChild(wrapper);
        }

        // 撤销座位分配
        function unassignSeat(row, seat) {
            if (seatMap[row].seats[seat]) {
                seatMap[row].seats[seat] = null;
                renderSeatMap();
                updateEmployeeList();
                saveData();
            }
        }
        
        // 切换空座位状态（空 ↔ /）
        function toggleEmptySeat(row, seat) {
            const currentVal = seatMap[row].seats[seat];
            if (currentVal === '/') {
                seatMap[row].seats[seat] = null;
            } else {
                seatMap[row].seats[seat] = '/';
            }
            renderSeatMap();
            saveData();
        }

        // 解析员工名单
        function parseEmployees() {
            const input = document.getElementById('employee-input').value;
            employees = input.split('\n')
                .map(name => name.trim())
                .filter(name => name.length > 0);
            
            updateEmployeeList();
            saveData();
        }

        // 解析员工名字，获取部门
        function parseEmployeeName(fullName) {
            const parts = fullName.split('-');
            if (parts.length >= 2 && Object.keys(DEPARTMENTS).includes(parts[0])) {
                return {
                    department: parts[0],
                    name: parts.slice(1).join('-'),
                    fullName: fullName
                };
            }
            return {
                department: '其他',
                name: fullName,
                fullName: fullName
            };
        }

        // 更新员工列表显示
        function updateEmployeeList() {
            const container = document.getElementById('employee-list-container');
            const countSpan = document.getElementById('employee-count');
            
            container.innerHTML = '';
            
            // 获取已分配座位的员工
            const assignedEmployees = new Set();
            seatMap.forEach(row => {
                row.seats.forEach(name => {
                    if (name) assignedEmployees.add(name);
                });
            });
            
            // 只显示未分配的员工
            const unassignedEmployees = employees.filter(name => !assignedEmployees.has(name));
            countSpan.textContent = `待分配：${unassignedEmployees.length} 名 / 总共：${employees.length} 名`;
            
            // 按部门分组
            const employeesByDept = {};
            // 先初始化所有部门
            Object.keys(DEPARTMENTS).forEach(dept => {
                employeesByDept[dept] = [];
            });
            
            unassignedEmployees.forEach(fullName => {
                const { department } = parseEmployeeName(fullName);
                employeesByDept[department].push(fullName);
            });
            
            // 渲染每个部门（不包括其他）
            Object.keys(employeesByDept).forEach(dept => {
                const deptEmployees = employeesByDept[dept];
                if (deptEmployees.length === 0 || dept === '其他') return; // 跳过空部门和其他部门
                
                const deptStyle = DEPARTMENTS[dept] || DEPARTMENTS['其他'];
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'department-group';
                groupDiv.style.backgroundColor = deptStyle.light;
                groupDiv.style.borderColor = deptStyle.color;
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'department-title';
                titleDiv.style.borderBottom = `2px solid ${deptStyle.color}`;
                titleDiv.style.color = deptStyle.color;
                titleDiv.innerHTML = `<span>${dept}</span><span class="department-count" style="color: ${deptStyle.color};">剩余${deptEmployees.length}人</span>`;
                
                const listDiv = document.createElement('div');
                listDiv.className = 'department-employee-list';
                
                deptEmployees.forEach(fullName => {
                    const { name } = parseEmployeeName(fullName);
                    const tag = document.createElement('span');
                    tag.className = 'employee-tag';
                    tag.style.backgroundColor = deptStyle.light;
                    tag.style.color = deptStyle.color;
                    tag.style.border = `1px solid ${deptStyle.color}`;
                    tag.textContent = name; // 只显示名字，不显示部门
                    tag.draggable = true;
                    tag.dataset.employee = fullName; // 拖拽时传递全名
                    tag.title = fullName; // 鼠标悬停显示全名
                    tag.ondragstart = onEmployeeDragStart;
                    tag.ondragend = onDragEnd;
                    
                    // 添加 hover 效果
                    tag.addEventListener('mouseenter', () => {
                        tag.style.backgroundColor = deptStyle.color;
                        tag.style.color = 'white';
                        tag.style.transform = 'scale(1.05)';
                    });
                    tag.addEventListener('mouseleave', () => {
                        tag.style.backgroundColor = deptStyle.light;
                        tag.style.color = deptStyle.color;
                        tag.style.transform = 'scale(1)';
                    });
                    
                    listDiv.appendChild(tag);
                });
                
                groupDiv.appendChild(titleDiv);
                groupDiv.appendChild(listDiv);
                container.appendChild(groupDiv);
            });
        }
        
        // 员工标签拖拽开始
        function onEmployeeDragStart(e) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setDragImage(e.target, 0, 0);
            e.dataTransfer.setData('employee', e.target.dataset.employee);
            e.target.classList.add('dragging');
            e.target.style.opacity = '0.3';
        }

        // 自动分配座位
        function autoAssignSeats() {
            parseEmployees();
            
            // 清空现有座位
            seatMap.forEach(row => {
                row.seats = new Array(row.cols * 2).fill(null);
            });
            
            // 计算总座位数
            let totalSeats = 0;
            seatMap.forEach(row => {
                totalSeats += row.seats.length;
            });
            
            if (employees.length > totalSeats) {
                alert(`座位数不足！当前座位数：${totalSeats}，员工数：${employees.length}`);
                return;
            }
            
            // 分配座位
            let employeeIndex = 0;
            for (let rowIndex = 0; rowIndex < seatMap.length; rowIndex++) {
                for (let seatIndex = 0; seatIndex < seatMap[rowIndex].seats.length; seatIndex++) {
                    if (employeeIndex < employees.length) {
                        seatMap[rowIndex].seats[seatIndex] = employees[employeeIndex];
                        employeeIndex++;
                    }
                }
            }
            
            renderSeatMap();
            updateEmployeeList();
            saveData();
        }

        // 清空座位
        function clearSeats() {
            seatMap.forEach(row => {
                row.seats = new Array(row.cols * 2).fill(null);
            });
            renderSeatMap();
            updateEmployeeList();
            saveData();
        }

        // 撤销座位分配
        function unassignSeat(row, seat) {
            if (seatMap[row].seats[seat]) {
                seatMap[row].seats[seat] = null;
                renderSeatMap();
                updateEmployeeList();
                saveData();
            }
        }

        // 拖拽相关函数
        function onDragStart(e) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setDragImage(e.target, 0, 0);
            
            if (e.target.dataset.employee) {
                // 从员工列表拖拽
                e.dataTransfer.setData('employee', e.target.dataset.employee);
                e.target.classList.add('dragging');
                e.target.style.opacity = '0.3';
            } else {
                // 座位之间拖拽
                draggedElement = e.target;
                draggedSeatPosition = {
                    row: parseInt(e.target.dataset.row),
                    seat: parseInt(e.target.dataset.seat)
                };
                e.target.classList.add('dragging');
                e.dataTransfer.setData('type', 'seat');
            }
        }

        function onDragEnd(e) {
            if (e.target.classList.contains('dragging')) {
                e.target.classList.remove('dragging');
                e.target.style.opacity = '1';
            }
        }

        function onDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const seatElement = getSeatElement(e.target);
            if (seatElement) {
                seatElement.classList.add('drag-over');
            }
        }

        function onDragLeave(e) {
            const seatElement = getSeatElement(e.target);
            if (seatElement) {
                seatElement.classList.remove('drag-over');
            }
        }

        function getSeatElement(element) {
            if (element.classList.contains('seat-name')) {
                return element;
            }
            if (element.parentElement && element.parentElement.classList.contains('desk-unit')) {
                return element.parentElement.querySelector('.seat-name');
            }
            return null;
        }

        function onDrop(e) {
            e.preventDefault();
            
            const seatElement = getSeatElement(e.target);
            if (seatElement) {
                seatElement.classList.remove('drag-over');
            }
            
            const targetRow = seatElement ? parseInt(seatElement.dataset.row) : null;
            const targetSeat = seatElement ? parseInt(seatElement.dataset.seat) : null;
            
            if (isNaN(targetRow) || isNaN(targetSeat)) return;
            
            const employeeName = e.dataTransfer.getData('employee');
            if (employeeName) {
                // 从员工列表拖到座位
                seatMap[targetRow].seats[targetSeat] = employeeName;
            } else if (draggedElement && seatElement && seatElement !== draggedElement) {
                // 座位之间交换
                const sourceName = seatMap[draggedSeatPosition.row].seats[draggedSeatPosition.seat];
                const targetName = seatMap[targetRow].seats[targetSeat];
                
                seatMap[draggedSeatPosition.row].seats[draggedSeatPosition.seat] = targetName;
                seatMap[targetRow].seats[targetSeat] = sourceName;
            }
            
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                draggedElement.style.opacity = '1';
            }
            renderSeatMap();
            updateEmployeeList();
            saveData();
        }

        // 导出为图片
        async function exportAsImage() {
            const element = document.getElementById('seat-map-overview');
            
            try {
                const canvas = await html2canvas(element, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    logging: false,
                    useCORS: true
                });
                
                // 创建下载链接
                const link = document.createElement('a');
                link.download = `座位表_${new Date().toLocaleDateString()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                console.error('导出图片失败:', error);
                alert('导出图片失败，请重试');
            }
        }

        // 预览导出效果
        async function previewImage() {
            const element = document.getElementById('seat-map-overview');
            
            try {
                const canvas = await html2canvas(element, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    logging: false,
                    useCORS: true
                });
                
                const modal = document.getElementById('preview-modal');
                const container = document.getElementById('preview-image-container');
                container.innerHTML = '';
                
                const img = document.createElement('img');
                img.src = canvas.toDataURL('image/png');
                container.appendChild(img);
                
                modal.style.display = 'flex';
            } catch (error) {
                console.error('预览失败:', error);
                alert('预览失败，请重试');
            }
        }

        // 关闭模态框
        function closeModal(e) {
            if (!e || e.target.id === 'preview-modal' || e.target.className === 'close-modal') {
                document.getElementById('preview-modal').style.display = 'none';
            }
        }

        // 导入文件
        async function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            try {
                let text = '';
                
                if (file.name.endsWith('.txt') || file.name.endsWith('.csv')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        text = e.target.result;
                        processImportedText(text);
                    };
                    reader.readAsText(file, 'UTF-8');
                } else {
                    alert('不支持的文件格式，请使用 .txt 或 .csv 文件');
                }
            } catch (error) {
                console.error('导入失败:', error);
                alert('导入文件失败');
            }
        }

        // 处理导入的文本
        function processImportedText(text) {
            // 尝试不同的分隔符
            let names = [];
            
            if (text.includes('\n')) {
                names = text.split('\n');
            } else if (text.includes(',')) {
                names = text.split(',');
            } else if (text.includes('\t')) {
                names = text.split('\t');
            } else {
                names = text.split(/\s+/);
            }
            
            names = names.map(n => n.trim()).filter(n => n.length > 0);
            
            if (names.length > 0) {
                document.getElementById('employee-input').value = names.join('\n');
                parseEmployees();
                alert(`成功导入 ${names.length} 名员工`);
            } else {
                alert('未找到有效的员工名单');
            }
        }

        // 拖拽文件上传支持
        const importArea = document.querySelector('.import-area');
        importArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            importArea.style.borderColor = '#667eea';
            importArea.style.background = '#f8f9ff';
        });

        importArea.addEventListener('dragleave', () => {
            importArea.style.borderColor = '#ccc';
            importArea.style.background = 'white';
        });

        importArea.addEventListener('drop', (e) => {
            e.preventDefault();
            importArea.style.borderColor = '#ccc';
            importArea.style.background = 'white';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('file-input').files = files;
                importFile({ target: { files: files } });
            }
        });
    </script>
